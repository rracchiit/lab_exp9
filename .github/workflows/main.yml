
name: Hello World CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Step 4: Validate Python syntax
      - name: Validate Python syntax
        run: python -m py_compile app.py test_app.py

      # Step 5: Run automated tests
      - name: Run tests
        run: pytest -v

      # Step 6: Create build artifact
      - name: Create build artifact
        run: |
          mkdir hello-world-package
          cp app.py test_app.py hello-world-package/

      # Step 7: Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-package
          path: hello-world-package/
